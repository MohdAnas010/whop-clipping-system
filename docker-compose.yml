services:
  app:
    build: .
    container_name: whop-clipping-agent
    environment:
      - PIPELINE_MODE=whop_first
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - LLM_MAX_CALLS_PER_DAY=2
      - LLM_MAX_OUTPUT_TOKENS=768
      - DATA_DIR=/app/data
      - RENDER_OUT=/app/out
    volumes:
      - ./out:/app/out
      - ./data:/app/data
      - ./source:/app/source:ro
    # One preparation job; schedule only after a successful end-to-end run.
    restart: 'no'
