name: Whop first preparation
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whop-first
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.WHOP_FIRST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion editor
        working-directory: agents/editor
        run: npm ci --no-audit --no-fund
      - name: Install preparation dependencies
        run: |
          pip install -r orchestrator/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: orchestrator/data/llm_*
          key: whop-llm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whop-llm-
      - name: Load approved campaign
        env:
          CAMPAIGN_JSON: ${{ secrets.APPROVED_CAMPAIGN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder = Path('orchestrator/data')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'approved_campaign.json').write_text(os.environ['CAMPAIGN_JSON'])
          PY
      - name: Preflight and prepare
        env:
          PIPELINE_MODE: whop_first
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          LLM_MAX_CALLS_PER_DAY: '2'
          LLM_MAX_OUTPUT_TOKENS: '768'
        run: |
          python orchestrator/whop_first.py --preflight
          python orchestrator/whop_first.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: orchestrator/data/llm_*
          key: whop-llm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whop-preparation-${{ github.run_id }}
          path: |
            orchestrator/out/
            orchestrator/data/whop_first_report.json
            orchestrator/data/upload_packages.json
          retention-days: 7
          if-no-files-found: warn
